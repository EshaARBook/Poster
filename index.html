let ha=1;function hint(){ha+=((AC&&AC.state==='running'?0:1)-ha)*.06;if(ha<.01)return;x.save();x.globalAlpha=ha;x.font='italic bold 28px "Times New Roman",Times,serif';x.fillStyle='#f4d6a0';x.textAlign='center';x.letterSpacing='1px';x.fillText('TOUCH THE SCREEN TO HEAR SOUND',M.W/2,52);x.restore()}
const cfg=[{d:0,f:300,dr:40,r:1.1,ph:0},{d:.08,f:260,dr:-45,r:-1.4,ph:1.7},{d:.15,f:330,dr:35,r:1.8,ph:3.1}];
function draw(t){const p=(1-Math.cos(2*Math.PI*t/T))/2;x.clearRect(0,0,M.W,M.H);x.drawImage(I.base,0,0);
// clock melt
{const[b0,y0,b1,y1]=M.clock,h=y1-y0,s=3,Mx=75*sm(p);
for(let y=y0;y<y1;y+=s){const u=(y-y0)/h,u2=u*u,f=y+Mx*u2,f2=Math.min(y+s,y1)+Mx*((Math.min(y+s,y1)-y0)/h)**2;
x.drawImage(I.clock,b0,y,b1-b0,Math.min(s,y1-y),b0+Mx*.18*u2,f,b1-b0,f2-f+1)}}
// cloth flow
{const[b0,y0,b1,y1]=M.cloth,A=11,k=.011,ph=2.4*Math.PI*p,s=3;
for(let X=b0;X<b1;X+=s){const w=Math.min(s,b1-X),dy=A*(Math.sin(X*k+ph)-Math.sin(X*k))+A*.5*(Math.sin(X*k*2.3+ph*1.3)-Math.sin(X*k*2.3));
x.drawImage(I.cloth,X,y0,w,y1-y0,X,y0+dy,w+1,y1-y0)}}
// petals
P.forEach((im,i)=>{const o=cfg[i],[a,b,c2,d]=M.petals[i],q=sm((p-o.d)/(1-o.d)),cx=(a+c2)/2,cy=(b+d)/2;
x.save();x.translate(cx+o.dr*Math.sin(q*Math.PI*1.2+o.ph)*1.0+o.dr*q*.5,cy+o.f*q);x.rotate(o.r*q);x.scale(1-.28*Math.abs(Math.sin(q*4+o.ph)),1);
x.drawImage(im,-(c2-a)/2,-(d-b)/2);x.restore()});
// title slides out
{const e=sm(p/.85);x.save();x.translate(-M.W*.98*e,-M.H*.03*e);x.drawImage(I.text,0,0);x.restore()}hint();return p}
const R=[];let last=0;
const add=e=>{const r=c.getBoundingClientRect();R.push({x:(e.clientX-r.left)*M.W/r.width,y:(e.clientY-r.top)*M.H/r.height,t:performance.now()});if(R.length>4)R.shift()};
c.addEventListener('pointerdown',add);c.addEventListener('pointermove',e=>{if(e.buttons&&e.timeStamp-last>160){last=e.timeStamp;add(e)}});
function fx(now){for(let i=R.length-1;i>=0;i--)if((now-R[i].t)/1000>1.8)R.splice(i,1);
for(const o of R){const a=(now-o.t)/1000,rr=a*300,m=rr+70,x0=Math.max(0,Math.floor(o.x-m)),y0=Math.max(0,Math.floor(o.y-m)),x1=Math.min(M.W,Math.ceil(o.x+m)),y1=Math.min(M.H,Math.ceil(o.y+m)),w=x1-x0,h=y1-y0;if(w<2||h<2)continue;
const s=x.getImageData(x0,y0,w,h),S=s.data,d=new ImageData(new Uint8ClampedArray(S),w,h),D=d.data,A=7*Math.exp(-a*1.6);
for(let j=0;j<h;j++)for(let i=0;i<w;i++){const dx=i+x0-o.x,dy=j+y0-o.y,dist=Math.hypot(dx,dy)||1,k=dist-rr;if(k>60||k<-60)continue;const wv=Math.sin(k*.09)*Math.exp(-k*k/1400)*A;
let sx=Math.round(i-dx/dist*wv),sy=Math.round(j-dy/dist*wv);sx=sx<0?0:sx>=w?w-1:sx;sy=sy<0?0:sy>=h?h-1:sy;const a1=(j*w+i)*4,b1=(sy*w+sx)*4;D[a1]=S[b1];D[a1+1]=S[b1+1];D[a1+2]=S[b1+2];D[a1+3]=S[b1+3]}
x.putImageData(d,x0,y0)}}
let AC,GA,WH,CG,mut=false,pp=0,pe=0,pt=performance.now(),nx=0;const btn=document.createElement('button');
const upd=()=>btn.textContent=mut?'🔇':'🔊';
function initA(){if(AC){if(AC.state!=='running')AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();GA=AC.createGain();GA.connect(AC.destination);
const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const mk=(f,q)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(GA);s.start();return{fl,g}};
WH=mk(600,1.2);CG=mk(900,.5);AC.resume();upd()}
function ping(f,v,dur){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(GA);o.start(t);o.stop(t+dur+.05)}
const N=[1568,1760,2093,2349,2637,3136];
function aud(p,now){if(!AC)return;const dt=(now-pt)/1000;if(dt<=0)return;const e=sm(p/.85),sp=Math.abs(p-pp)/dt,es=Math.abs(e-pe)/dt;pp=p;pe=e;pt=now;const t=AC.currentTime;
GA.gain.setTargetAtTime(mut?0:.9,t,.05);
WH.g.gain.setTargetAtTime(Math.min(.2,es*.35),t,.08);WH.fl.frequency.setTargetAtTime(500+es*2200,t,.08);
CG.g.gain.setTargetAtTime(Math.min(.22,sp*.7)*(.7+.3*Math.sin(now/700)),t,.15);CG.fl.frequency.setTargetAtTime(700+sp*1800+300*Math.sin(now/900),t,.2);
if(now>nx&&!mut){const f=N[Math.floor(Math.random()*N.length)];ping(f,.04,1.2);ping(f*2.01,.015,.6);nx=now+250+Math.random()*750}}
btn.addEventListener('click',()=>{if(!AC){initA();return}mut=!mut;upd()});
['pointerdown','touchstart','click','keydown','wheel'].forEach(ev=>document.addEventListener(ev,initA,{passive:true}));try{initA()}catch(e){}
c.addEventListener('pointerdown',()=>{if(AC&&!mut)ping(1100+Math.random()*500,.06,.7)});
const t0=performance.now();(function f(n){const p=draw((n-t0)/1000%T);fx(performance.now());aud(p,performance.now());requestAnimationFrame(f)})(t0);
})();
</script></body></html>
